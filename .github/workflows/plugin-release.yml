name: Build WordPress plugin ZIP

# Runs on every push to main so a fresh, installable ZIP is always available
# as a downloadable artifact.  You install it yourself: WP Admin → Plugins →
# Add New → Upload Plugin.  Nothing is ever pushed to your site automatically.
#
# On tagged releases (e.g. v1.2.0) the ZIP is also attached to the GitHub
# Release page for permanent download.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # needed only for the release-asset upload step

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build frontend (Vite → dist/)
        run: npm run build

      - name: Copy compiled assets into plugin folder
        run: |
          mkdir -p wp-plugin/go3d/assets/dist
          cp -r dist/. wp-plugin/go3d/assets/dist/

      # Version comes from the git tag on releases; falls back to the short commit SHA
      - name: Determine version string
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VER="${{ github.event.release.tag_name }}"
            VER="${VER#v}"   # strip leading 'v'
          else
            VER="dev-$(git rev-parse --short HEAD)"
          fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "zip=go3d-${VER}.zip" >> "$GITHUB_OUTPUT"

      - name: Stamp version into plugin header
        run: |
          VER="${{ steps.version.outputs.ver }}"
          sed -i "s/^ \* Version:.*/ * Version:      $VER/" wp-plugin/go3d/go3d.php
          sed -i "s/define( 'GO3D_VERSION',.*/define( 'GO3D_VERSION',    '$VER' );/" wp-plugin/go3d/go3d.php

      - name: Package plugin ZIP
        run: |
          cd wp-plugin
          zip -r "../${{ steps.version.outputs.zip }}" go3d/ \
            --exclude "go3d/assets/dist/.vite/*" \
            --exclude "*/.DS_Store" \
            --exclude "*/__MACOSX/*"

      # ── Every push: upload as a downloadable Actions artifact (kept 14 days) ──
      - name: Upload artifact (every push)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.zip }}
          path: ${{ steps.version.outputs.zip }}
          retention-days: 14

      # ── Tagged releases only: also attach to the GitHub Release page ──────────
      - name: Attach ZIP to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.version.outputs.zip }}
